name: "${amazon_bedrock_model_provider_name}"
command: "amazon-bedrock-model-provider/bin/obot-provider"
validateArgs:
  - validate
icon: "/admin/assets/amazon-bedrock.png"
description: "${amazon_bedrock_model_provider_description}"
link: "https://aws.amazon.com/bedrock/"
requiredConfigurationParameters:
  - name: "OBOT_AMAZON_BEDROCK_MODEL_PROVIDER_ACCESS_KEY_ID"
    friendlyName: "${amazon_bedrock_model_provider_access_key_id_friendly_name}"
    description: "${amazon_bedrock_model_provider_access_key_id_description}"
    sensitive: true
  - name: "OBOT_AMAZON_BEDROCK_MODEL_PROVIDER_SECRET_ACCESS_KEY"
    friendlyName: "${amazon_bedrock_model_provider_secret_access_key_friendly_name}"
    description: "${amazon_bedrock_model_provider_secret_access_key_description}"
    sensitive: true
optionalConfigurationParameters:
  - name: "OBOT_AMAZON_BEDROCK_MODEL_PROVIDER_SESSION_TOKEN"
    friendlyName: "${amazon_bedrock_model_provider_session_token_friendly_name}"
    description: "${amazon_bedrock_model_provider_session_token_description}"
    sensitive: true
  - name: "OBOT_AMAZON_BEDROCK_MODEL_PROVIDER_REGION"
    friendlyName: "${amazon_bedrock_model_provider_region_friendly_name}"
    description: "${amazon_bedrock_model_provider_region_description}"
    sensitive: false
