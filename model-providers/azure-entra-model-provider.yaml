name: "${azure_entra_model_provider_name}"
command: "azure-entra-model-provider/bin/obot-provider"
validateArgs:
  - validate
icon: "/admin/assets/azure_openai_icon.svg"
iconDark: "/admin/assets/azure_openai_icon.svg"
description: "${azure_entra_model_provider_description}"
link: "https://azure.microsoft.com/en-us/products/ai-services/openai-service"
requiredConfigurationParameters:
  - name: "OBOT_AZURE_ENTRA_MODEL_PROVIDER_ENDPOINT"
    friendlyName: "${azure_entra_model_provider_endpoint_friendly_name}"
    description: "${azure_entra_model_provider_endpoint_description}"
    sensitive: false
  - name: "OBOT_AZURE_ENTRA_MODEL_PROVIDER_CLIENT_ID"
    friendlyName: "${azure_entra_model_provider_client_id_friendly_name}"
    description: "${azure_entra_model_provider_client_id_description}"
    sensitive: false
  - name: "OBOT_AZURE_ENTRA_MODEL_PROVIDER_CLIENT_SECRET"
    friendlyName: "${azure_entra_model_provider_client_secret_friendly_name}"
    description: "${azure_entra_model_provider_client_secret_description}"
    sensitive: true
  - name: "OBOT_AZURE_ENTRA_MODEL_PROVIDER_TENANT_ID"
    friendlyName: "${azure_entra_model_provider_tenant_id_friendly_name}"
    description: "${azure_entra_model_provider_tenant_id_description}"
    sensitive: false
  - name: "OBOT_AZURE_ENTRA_MODEL_PROVIDER_SUBSCRIPTION_ID"
    friendlyName: "${azure_entra_model_provider_subscription_id_friendly_name}"
    description: "${azure_entra_model_provider_subscription_id_description}"
    sensitive: false
  - name: "OBOT_AZURE_ENTRA_MODEL_PROVIDER_RESOURCE_GROUP"
    friendlyName: "${azure_entra_model_provider_resource_group_friendly_name}"
    description: "${azure_entra_model_provider_resource_group_description}"
    sensitive: false
  - name: "OBOT_AZURE_ENTRA_MODEL_PROVIDER_RESOURCE_NAME"
    friendlyName: "${azure_entra_model_provider_resource_name_friendly_name}"
    description: "${azure_entra_model_provider_resource_name_description}"
    sensitive: false
