name: "${azure_model_provider_name}"
command: "azure-model-provider/bin/obot-provider"
validateArgs:
  - validate
icon: "/admin/assets/azure_openai_icon.svg"
iconDark: "/admin/assets/azure_openai_icon.svg"
description: "${azure_model_provider_description}"
link: "https://azure.microsoft.com/en-us/products/ai-services/openai-service"
requiredConfigurationParameters:
  - name: "OBOT_AZURE_MODEL_PROVIDER_ENDPOINT"
    friendlyName: "${azure_model_provider_endpoint_friendly_name}"
    description: "${azure_model_provider_endpoint_description}"
    sensitive: false
  - name: "OBOT_AZURE_MODEL_PROVIDER_API_KEY"
    friendlyName: "${azure_model_provider_api_key_friendly_name}"
    description: "${azure_model_provider_api_key_description}"
    sensitive: true
  - name: "OBOT_AZURE_MODEL_PROVIDER_DEPLOYMENTS"
    friendlyName: "${azure_model_provider_deployments_friendly_name}"
    description: "${azure_model_provider_deployments_description}"
    sensitive: false
