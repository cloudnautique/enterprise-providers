name: "${gemini_vertex_model_provider_name}"
command: "gemini-vertex-model-provider/bin/obot-provider"
validateArgs:
  - validate
icon: "/admin/assets/gemini_icon.svg"
iconDark: "/admin/assets/gemini_icon.svg"
description: "${gemini_vertex_model_provider_description}"
link: "https://cloud.google.com/vertex-ai"
requiredConfigurationParameters:
  - name: "OBOT_GEMINI_VERTEX_MODEL_PROVIDER_GOOGLE_CREDENTIALS_JSON"
    friendlyName: "${gemini_vertex_model_provider_google_credentials_json_friendly_name}"
    description: "${gemini_vertex_model_provider_google_credentials_json_description}"
    sensitive: true
optionalConfigurationParameters:
  - name: "OBOT_GEMINI_VERTEX_MODEL_PROVIDER_GOOGLE_CLOUD_PROJECT"
    friendlyName: "${gemini_vertex_model_provider_google_cloud_project_friendly_name}"
    description: "${gemini_vertex_model_provider_google_cloud_project_description}"
    sensitive: false
  - name: "OBOT_GEMINI_VERTEX_MODEL_PROVIDER_GOOGLE_CLOUD_LOCATION"
    friendlyName: "${gemini_vertex_model_provider_google_cloud_location_friendly_name}"
    description: "${gemini_vertex_model_provider_google_cloud_location_description}"
    sensitive: false
