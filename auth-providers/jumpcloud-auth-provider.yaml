name: "${jumpcloud_auth_provider_name}"
command: "jumpcloud-auth-provider/bin/obot-provider"
icon: "https://jumpcloud.com/wp-content/themes/jumpcloud/assets/images/favicons/android-icon-192x192-light.png"
description: "${jumpcloud_auth_provider_description}"
link: "https://jumpcloud.com/"
requiredEntitlements:
  - "OBOT_ENTERPRISE_AUTH_PROVIDERS"
requiredConfigurationParameters:
  - name: "OBOT_JUMPCLOUD_AUTH_PROVIDER_CLIENT_ID"
    friendlyName: "${jumpcloud_auth_provider_client_id_friendly_name}"
    description: "${jumpcloud_auth_provider_client_id_description}"
    sensitive: false
  - name: "OBOT_JUMPCLOUD_AUTH_PROVIDER_CLIENT_SECRET"
    friendlyName: "${jumpcloud_auth_provider_client_secret_friendly_name}"
    description: "${jumpcloud_auth_provider_client_secret_description}"
    sensitive: true
  - name: "OBOT_AUTH_PROVIDER_EMAIL_DOMAINS"
    friendlyName: "${jumpcloud_auth_provider_email_domains_friendly_name}"
    description: "${jumpcloud_auth_provider_email_domains_description}"
    sensitive: false
  - name: "OBOT_AUTH_PROVIDER_COOKIE_SECRET"
    friendlyName: "${jumpcloud_auth_provider_cookie_secret_friendly_name}"
    description: "${jumpcloud_auth_provider_cookie_secret_description}"
    sensitive: true
    hidden: true
optionalConfigurationParameters:
  - name: "OBOT_JUMPCLOUD_AUTH_PROVIDER_SERVICE_ACCOUNT_CLIENT_ID"
    friendlyName: "${jumpcloud_auth_provider_service_account_client_id_friendly_name}"
    description: "${jumpcloud_auth_provider_service_account_client_id_description}"
    sensitive: false
  - name: "OBOT_JUMPCLOUD_AUTH_PROVIDER_SERVICE_ACCOUNT_CLIENT_SECRET"
    friendlyName: "${jumpcloud_auth_provider_service_account_client_secret_friendly_name}"
    description: "${jumpcloud_auth_provider_service_account_client_secret_description}"
    sensitive: true
  - name: "OBOT_JUMPCLOUD_AUTH_PROVIDER_API_KEY"
    friendlyName: "${jumpcloud_auth_provider_api_key_friendly_name}"
    description: "${jumpcloud_auth_provider_api_key_description}"
    sensitive: true
  - name: "OBOT_JUMPCLOUD_AUTH_PROVIDER_API_ORG_ID"
    friendlyName: "${jumpcloud_auth_provider_api_org_id_friendly_name}"
    description: "${jumpcloud_auth_provider_api_org_id_description}"
    sensitive: false
  - name: "OBOT_JUMPCLOUD_AUTH_PROVIDER_ISSUER_URL"
    friendlyName: "${jumpcloud_auth_provider_issuer_url_friendly_name}"
    description: "${jumpcloud_auth_provider_issuer_url_description}"
    sensitive: false
  - name: "OBOT_JUMPCLOUD_AUTH_PROVIDER_API_BASE_URL"
    friendlyName: "${jumpcloud_auth_provider_api_base_url_friendly_name}"
    description: "${jumpcloud_auth_provider_api_base_url_description}"
    sensitive: false
  - name: "OBOT_JUMPCLOUD_AUTH_PROVIDER_SERVICE_ACCOUNT_TOKEN_URL"
    friendlyName: "${jumpcloud_auth_provider_service_account_token_url_friendly_name}"
    description: "${jumpcloud_auth_provider_service_account_token_url_description}"
    sensitive: false
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_CONNECTION_DSN"
    friendlyName: "${jumpcloud_auth_provider_postgres_connection_dsn_friendly_name}"
    description: "${jumpcloud_auth_provider_postgres_connection_dsn_description}"
    sensitive: true
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_MAX_CONNECTIONS"
    friendlyName: "${jumpcloud_auth_provider_postgres_max_connections_friendly_name}"
    description: "${jumpcloud_auth_provider_postgres_max_connections_description}"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_MAX_IDLE_CONNECTIONS"
    friendlyName: "${jumpcloud_auth_provider_postgres_max_idle_connections_friendly_name}"
    description: "${jumpcloud_auth_provider_postgres_max_idle_connections_description}"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_CONNECTION_LIFETIME_SECONDS"
    friendlyName: "${jumpcloud_auth_provider_postgres_connection_lifetime_seconds_friendly_name}"
    description: "${jumpcloud_auth_provider_postgres_connection_lifetime_seconds_description}"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_TOKEN_REFRESH_DURATION"
    friendlyName: "${jumpcloud_auth_provider_token_refresh_duration_friendly_name}"
    description: "${jumpcloud_auth_provider_token_refresh_duration_description}"
    sensitive: false
  - name: "OBOT_AUTH_PROVIDER_ENABLE_LOGGING"
    friendlyName: "${jumpcloud_auth_provider_enable_logging_friendly_name}"
    description: "${jumpcloud_auth_provider_enable_logging_description}"
    sensitive: false
postgresTablePrefix: "jumpcloud_"
groupIDPrefix: "jumpcloud/"
