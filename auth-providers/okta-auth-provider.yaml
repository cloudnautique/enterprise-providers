name: "${okta_auth_provider_name}"
command: "okta-auth-provider/bin/obot-provider"
icon: "https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/okta.svg"
description: "${okta_auth_provider_description}"
link: "https://okta.com/"
requiredEntitlements:
  - "OBOT_ENTERPRISE_AUTH_PROVIDERS"
requiredConfigurationParameters:
  - name: "OBOT_OKTA_AUTH_PROVIDER_CLIENT_ID"
    friendlyName: "${okta_auth_provider_client_id_friendly_name}"
    description: "${okta_auth_provider_client_id_description}"
    sensitive: false
  - name: "OBOT_OKTA_AUTH_PROVIDER_CLIENT_SECRET"
    friendlyName: "${okta_auth_provider_client_secret_friendly_name}"
    description: "${okta_auth_provider_client_secret_description}"
    sensitive: true
  - name: "OBOT_OKTA_AUTH_PROVIDER_ISSUER_URL"
    friendlyName: "${okta_auth_provider_issuer_url_friendly_name}"
    description: "${okta_auth_provider_issuer_url_description}"
    sensitive: false
  - name: "OBOT_OKTA_AUTH_PROVIDER_SERVICE_CLIENT_ID"
    friendlyName: "${okta_auth_provider_service_client_id_friendly_name}"
    description: "${okta_auth_provider_service_client_id_description}"
    sensitive: false
  - name: "OBOT_OKTA_AUTH_PROVIDER_SERVICE_PRIVATE_KEY"
    friendlyName: "${okta_auth_provider_service_private_key_friendly_name}"
    description: "${okta_auth_provider_service_private_key_description}"
    sensitive: true
    multiline: true
  - name: "OBOT_AUTH_PROVIDER_COOKIE_SECRET"
    friendlyName: "${okta_auth_provider_cookie_secret_friendly_name}"
    description: "${okta_auth_provider_cookie_secret_description}"
    sensitive: true
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_EMAIL_DOMAINS"
    friendlyName: "${okta_auth_provider_email_domains_friendly_name}"
    description: "${okta_auth_provider_email_domains_description}"
    sensitive: false
optionalConfigurationParameters:
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_CONNECTION_DSN"
    friendlyName: "${okta_auth_provider_postgres_connection_dsn_friendly_name}"
    description: "${okta_auth_provider_postgres_connection_dsn_description}"
    sensitive: true
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_MAX_CONNECTIONS"
    friendlyName: "${okta_auth_provider_postgres_max_connections_friendly_name}"
    description: "${okta_auth_provider_postgres_max_connections_description}"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_MAX_IDLE_CONNECTIONS"
    friendlyName: "${okta_auth_provider_postgres_max_idle_connections_friendly_name}"
    description: "${okta_auth_provider_postgres_max_idle_connections_description}"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_CONNECTION_LIFETIME_SECONDS"
    friendlyName: "${okta_auth_provider_postgres_connection_lifetime_seconds_friendly_name}"
    description: "${okta_auth_provider_postgres_connection_lifetime_seconds_description}"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_TOKEN_REFRESH_DURATION"
    friendlyName: "${okta_auth_provider_token_refresh_duration_friendly_name}"
    description: "${okta_auth_provider_token_refresh_duration_description}"
    sensitive: false
  - name: "OBOT_AUTH_PROVIDER_ENABLE_LOGGING"
    friendlyName: "${okta_auth_provider_enable_logging_friendly_name}"
    description: "${okta_auth_provider_enable_logging_description}"
    sensitive: false
postgresTablePrefix: "okta_"
groupIDPrefix: "okta/"
