name: "${auth0_auth_provider_name}"
command: "auth0-auth-provider/bin/obot-provider"
icon: "https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/auth0.svg"
description: "${auth0_auth_provider_description}"
link: "https://auth0.com/"
requiredEntitlements:
  - "OBOT_ENTERPRISE_AUTH_PROVIDERS"
requiredConfigurationParameters:
  - name: "OBOT_AUTH0_AUTH_PROVIDER_CLIENT_ID"
    friendlyName: "${auth0_auth_provider_client_id_friendly_name}"
    description: "${auth0_auth_provider_client_id_description}"
    sensitive: false
  - name: "OBOT_AUTH0_AUTH_PROVIDER_CLIENT_SECRET"
    friendlyName: "${auth0_auth_provider_client_secret_friendly_name}"
    description: "${auth0_auth_provider_client_secret_description}"
    sensitive: true
  - name: "OBOT_AUTH0_AUTH_PROVIDER_DOMAIN"
    friendlyName: "${auth0_auth_provider_domain_friendly_name}"
    description: "${auth0_auth_provider_domain_description}"
    sensitive: false
  - name: "OBOT_AUTH0_AUTH_PROVIDER_MGMT_CLIENT_ID"
    friendlyName: "${auth0_auth_provider_mgmt_client_id_friendly_name}"
    description: "${auth0_auth_provider_mgmt_client_id_description}"
    sensitive: false
  - name: "OBOT_AUTH0_AUTH_PROVIDER_MGMT_CLIENT_SECRET"
    friendlyName: "${auth0_auth_provider_mgmt_client_secret_friendly_name}"
    description: "${auth0_auth_provider_mgmt_client_secret_description}"
    sensitive: true
  - name: "OBOT_AUTH_PROVIDER_COOKIE_SECRET"
    friendlyName: "${auth0_auth_provider_cookie_secret_friendly_name}"
    description: "${auth0_auth_provider_cookie_secret_description}"
    sensitive: true
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_EMAIL_DOMAINS"
    friendlyName: "${auth0_auth_provider_email_domains_friendly_name}"
    description: "${auth0_auth_provider_email_domains_description}"
    sensitive: false
optionalConfigurationParameters:
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_CONNECTION_DSN"
    friendlyName: "${auth0_auth_provider_postgres_connection_dsn_friendly_name}"
    description: "${auth0_auth_provider_postgres_connection_dsn_description}"
    sensitive: true
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_MAX_CONNECTIONS"
    friendlyName: "${auth0_auth_provider_postgres_max_connections_friendly_name}"
    description: "${auth0_auth_provider_postgres_max_connections_description}"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_MAX_IDLE_CONNECTIONS"
    friendlyName: "${auth0_auth_provider_postgres_max_idle_connections_friendly_name}"
    description: "${auth0_auth_provider_postgres_max_idle_connections_description}"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_CONNECTION_LIFETIME_SECONDS"
    friendlyName: "${auth0_auth_provider_postgres_connection_lifetime_seconds_friendly_name}"
    description: "${auth0_auth_provider_postgres_connection_lifetime_seconds_description}"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_TOKEN_REFRESH_DURATION"
    friendlyName: "${auth0_auth_provider_token_refresh_duration_friendly_name}"
    description: "${auth0_auth_provider_token_refresh_duration_description}"
    sensitive: false
  - name: "OBOT_AUTH0_AUTH_PROVIDER_INSECURE_ALLOW_UNVERIFIED_EMAIL"
    friendlyName: "${auth0_auth_provider_insecure_allow_unverified_email_friendly_name}"
    description: "${auth0_auth_provider_insecure_allow_unverified_email_description}"
    sensitive: false
    hidden: true
postgresTablePrefix: "auth0_"
groupIDPrefix: "auth0/"
