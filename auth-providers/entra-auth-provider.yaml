name: "${entra_auth_provider_name}"
command: "entra-auth-provider/bin/obot-provider"
icon: "/admin/assets/entra_icon.svg"
iconDark: "/admin/assets/entra_icon.svg"
description: "${entra_auth_provider_description}"
link: "https://entra.microsoft.com/"
requiredEntitlements:
  - "OBOT_ENTERPRISE_AUTH_PROVIDERS"
requiredConfigurationParameters:
  - name: "OBOT_ENTRA_AUTH_PROVIDER_CLIENT_ID"
    friendlyName: "${entra_auth_provider_client_id_friendly_name}"
    description: "${entra_auth_provider_client_id_description}"
    sensitive: false
  - name: "OBOT_ENTRA_AUTH_PROVIDER_CLIENT_SECRET"
    friendlyName: "${entra_auth_provider_client_secret_friendly_name}"
    description: "${entra_auth_provider_client_secret_description}"
    sensitive: true
  - name: "OBOT_ENTRA_AUTH_PROVIDER_TENANT_ID"
    friendlyName: "${entra_auth_provider_tenant_id_friendly_name}"
    description: "${entra_auth_provider_tenant_id_description}"
    sensitive: false
  - name: "OBOT_AUTH_PROVIDER_COOKIE_SECRET"
    friendlyName: "${entra_auth_provider_cookie_secret_friendly_name}"
    description: "${entra_auth_provider_cookie_secret_description}"
    sensitive: true
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_EMAIL_DOMAINS"
    friendlyName: "${entra_auth_provider_email_domains_friendly_name}"
    description: "${entra_auth_provider_email_domains_description}"
    sensitive: false
optionalConfigurationParameters:
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_CONNECTION_DSN"
    friendlyName: "${entra_auth_provider_postgres_connection_dsn_friendly_name}"
    description: "${entra_auth_provider_postgres_connection_dsn_description}"
    sensitive: true
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_MAX_CONNECTIONS"
    friendlyName: "${entra_auth_provider_postgres_max_connections_friendly_name}"
    description: "${entra_auth_provider_postgres_max_connections_description}"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_MAX_IDLE_CONNECTIONS"
    friendlyName: "${entra_auth_provider_postgres_max_idle_connections_friendly_name}"
    description: "${entra_auth_provider_postgres_max_idle_connections_description}"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_CONNECTION_LIFETIME_SECONDS"
    friendlyName: "${entra_auth_provider_postgres_connection_lifetime_seconds_friendly_name}"
    description: "${entra_auth_provider_postgres_connection_lifetime_seconds_description}"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_ENABLE_LOGGING"
    friendlyName: "${entra_auth_provider_enable_logging_friendly_name}"
    description: "${entra_auth_provider_enable_logging_description}"
    sensitive: false
postgresTablePrefix: "entra_"
groupIDPrefix: "entra/"
